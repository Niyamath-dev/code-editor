<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="bootstrap-5.3.3-dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 100%; max-width: 400px;">
      <h3 class="text-center mb-4">Welcome</h3>
      <form action="loginauth.php" method="POST" id="authForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
        <p class="text-center mt-3">New user? <a href="signup.html">Signup</a></p>
        <p class="text-center mt-1"><a href="forgot_password.html">Forgot Password?</a></p>
        <div id="error-message" class="alert alert-danger mt-3" style="display: none;"></div>
      </form>         
    </div>
  </div>

  <script src="bootstrap-5.3.3-dist/js/bootstrap.min.js"></script>
  <script>
    // Function to get URL parameters
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    // Display error message if it exists
    const errorMessage = getQueryParam('error');
    if (errorMessage) {
      document.getElementById('error-message').innerText = errorMessage;
      document.getElementById('error-message').style.display = 'block';
    }
  </script>
</body>
</html>
